name: Feature Request
description: Propose a new feature, workflow improvement, or export format
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping shape Dhap!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or friction in your workflow?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered?
