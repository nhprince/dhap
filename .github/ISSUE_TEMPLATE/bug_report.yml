name: Bug Report
description: Report an issue or bug in Dhap
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a problem in Dhap! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Dhap Version
      description: What version of Dhap or dhap-cli are you running? (Run `dhap version`)
      placeholder: e.g., 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10 (x86_64)
        - macOS (Apple Silicon / aarch64)
        - macOS (Intel / x86_64)
        - Linux (x86_64)
        - Linux (aarch64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Open project...
        2. Extract keyframes from...
        3. Click Export...
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
