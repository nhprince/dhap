<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Ascending Steps Motif -->
  <g transform="translate(24, 22)">
    <!-- Step 1 -->
    <rect x="0" y="58" width="18" height="26" rx="3" fill="#475569" />
    <!-- Step 2 -->
    <rect x="20" y="40" width="18" height="44" rx="3" fill="#64748B" />
    <!-- Step 3 -->
    <rect x="40" y="22" width="18" height="62" rx="3" fill="#94A3B8" />
    <!-- Active Step 4 -->
    <rect x="60" y="4" width="20" height="80" rx="4" fill="url(#activeGrad)" />

    <!-- Pulse indicator dot -->
    <circle cx="70" cy="-3" r="5" fill="#FB923C" />
  </g>
</svg>
